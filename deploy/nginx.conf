server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # live updates (server-sent events) must not be buffered
    location /api/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }

    # single-page app: every other route serves index.html
    location / {
        try_files $uri /index.html;
    }
}
