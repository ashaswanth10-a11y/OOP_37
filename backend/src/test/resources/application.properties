spring.datasource.url=jdbc:h2:mem:campusops-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

campusops.auth.jwt-secret=test-secret-for-campusops-integration-tests-0123456789
campusops.auth.allowed-domain=hyderabad.bits-pilani.ac.in
campusops.cors.origins=http://localhost:5173
# never call real external services from tests
campusops.gemini.api-key=
# the SLA monitor is driven explicitly by tests
campusops.sla.monitor-interval-ms=3600000
spring.jackson.deserialization.fail-on-null-for-primitives=false
campusops.seed.enabled=true
campusops.seed.history=true
