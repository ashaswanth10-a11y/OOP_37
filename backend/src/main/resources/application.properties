spring.application.name=campusops
server.port=${PORT:8080}

# Secrets and keys come from environment variables or a .env file next to the backend or repo root
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Default: embedded H2 file database (zero setup). Use the "postgres" profile for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/campusops;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

campusops.auth.jwt-secret=${JWT_SECRET:campusops-dev-secret-change-me-in-production-0123456789}
campusops.auth.allowed-domain=${ALLOWED_DOMAIN:hyderabad.bits-pilani.ac.in}
campusops.auth.token-hours=12
campusops.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

campusops.gemini.api-key=${GEMINI_API_KEY:}
campusops.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

campusops.sla.monitor-interval-ms=15000
campusops.seed.enabled=${SEED_ENABLED:true}

# optional true/false flags may be left out of request bodies (they default to false)
spring.jackson.deserialization.fail-on-null-for-primitives=false

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
